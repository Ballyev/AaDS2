name: CI for Linear Solver

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev clang-format cppcheck

      - name: Build project
        run: make all

      - name: Run tests
        run: make test

      - name: Format code (optional)
        run: make format

      - name: Lint code (optional)
        run: make lint